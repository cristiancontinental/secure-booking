<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary px-3">
  <a class="navbar-brand">SecureBooking</a>

  <div class="d-flex align-items-center gap-3 text-white">
    <span id="userName"></span>
    <button class="btn btn-light btn-sm" onclick="logout()">Salir</button>
  </div>
</nav>

<div class="container mt-4">

  <!-- FORMULARIO -->
  <div class="card p-3">

    <h5>Crear cita</h5>

    <select class="form-select mb-2" id="service">
      <option>Corte de cabello</option>
      <option>Consulta médica</option>
      <option>Cita odontológica</option>
      <option>Reunión</option>
      <option>Otro</option>
    </select>

    <input type="date" class="form-control mb-2" id="date">
    <input type="time" class="form-control mb-2" id="time">

    <textarea class="form-control mb-2" id="description" placeholder="Descripción"></textarea>

    <button class="btn btn-primary w-100" onclick="createReservation()">
      Crear cita
    </button>

  </div>

  <!-- LISTA DE CITAS -->
  <div id="list" class="mt-3"></div>

</div>

<script src="js/dashboard.js"></script>
<script src="js/reservations.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

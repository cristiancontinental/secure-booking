<!DOCTYPE html>
<html>
<head>
  <title>Registro</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">

  <div class="card p-4 shadow" style="width: 350px;">

    <h3 class="text-center mb-3">Registro</h3>

    <input class="form-control mb-2" type="text" id="name" placeholder="Nombre">
    <input class="form-control mb-2" type="email" id="email" placeholder="Email">
    <input class="form-control mb-3" type="password" id="password" placeholder="Password">

    <button class="btn btn-success w-100" onclick="register()">
      Registrar
    </button>

  </div>

</div>

<script src="js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

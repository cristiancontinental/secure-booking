<!DOCTYPE html>
<html>
<head>
  <title>Editar Cita</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-3">
  <a class="navbar-brand">Editar Cita</a>
</nav>

<div class="container mt-4">

  <div class="card p-3">

    <h5>Actualizar reserva</h5>

    <select class="form-select mb-2" id="service">
      <option>Corte de cabello</option>
      <option>Consulta médica</option>
      <option>Cita odontológica</option>
      <option>Reunión</option>
      <option>Otro</option>
    </select>

    <input type="date" class="form-control mb-2" id="date">
    <input type="time" class="form-control mb-2" id="time">

    <textarea class="form-control mb-2" id="description"></textarea>

    <button class="btn btn-success w-100" onclick="updateReservation()">
      Guardar cambios
    </button>

  </div>

</div>

<script src="js/edit.js"></script>

</body>
</html>
